# Sitio de Barrio para Nginx. setup-vps.sh reemplaza __API_DOMAIN__ y __BACKEND_PORT__;
# certbot agrega después el bloque HTTPS y la redirección.
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
