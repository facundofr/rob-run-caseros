; =====================================================================================
; DefaultEngine_render.ini - Barrio (Caseros) / UE 5.8.4 / objetivo: RTX 5050 8 GB a 60 fps
; Mezclar en Config/DefaultEngine.ini (reemplazar claves repetidas, no duplicarlas).
; IMPORTANTE: en los .ini de Unreal el ';' solo comenta si está al principio de la línea.
;             Nunca poner comentarios al final de una clave.
; Marcas:  [R] = requiere reiniciar el editor   [S] = recompila shaders (la primera vez tarda)
;          [D] = regenera datos derivados (distance fields) de todas las mallas
;          (sin marca = se aplica en caliente)
; Después del reinicio, volver a correr setup_lighting.py (lee r.SupportSkyAtmosphereAffectsHeightFog
; y r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange para elegir valores).
;
; DECISIÓN HARDWARE RAY TRACING (HWRT) PARA LUMEN: SÍ, con iluminación por Surface Cache.
;  - El barrio está lleno de geometría fina: cables, rejas, postes, persianas, marcos. Lumen por
;    software traza distance fields que no representan bien objetos de menos de ~10 cm
;    (fugas de luz, rejas que "desaparecen" del GI, reflejos borrosos en vidrios y charcos).
;  - La RTX 5050 tiene RT cores de 4a generación; desde 5.6 Lumen HWRT apunta a 60 Hz en
;    consolas, que tienen bastante menos potencia de RT que esta placa.
;  - Costo: BVH estimado en 300-700 MB de VRAM para un barrio así. Con 8 GB, TSR y Nanite entra,
;    pero hay que medir con `stat gpu`, `stat rhi` y `r.Lumen.HardwareRayTracing 0/1` en caliente.
;    Hit Lighting queda APAGADO (no entra en 60 fps); las sombras siguen siendo VSM (no RT).
;  - Se conservan los distance fields: son el fallback de la escalabilidad "Medio"
;    (r.Lumen.HardwareRayTracing=0) y alimentan sombras/AO de largo alcance.
;  - Rollback: r.Lumen.HardwareRayTracing=False (en caliente). Si la VRAM no da, además
;    r.RayTracing=False [R][S].
; =====================================================================================

[/Script/Engine.RendererSettings]
; ---------- Iluminación global y reflejos
; 1 = Lumen para GI dinámica (todo el ciclo día/noche es dinámico)
r.DynamicGlobalIlluminationMethod=1
; 1 = Lumen para reflejos (vidrios, charcos, chapa)
r.ReflectionMethod=1
; Lumen usa HWRT si la GPU lo soporta (ver decisión arriba)
r.Lumen.HardwareRayTracing=True
; 0 = Surface Cache (barato). 2 = Hit Lighting: NO a 60 fps en esta placa
r.Lumen.HardwareRayTracing.LightingMode=0
; Fallback por software: traza SDF por malla (más detalle que solo el SDF global)
r.Lumen.TraceMeshSDFs=True
; [S] Reflejos de calidad en la primera capa translúcida (vidrios de ventanas)
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
; [R][S] Sin lightmaps: todo dinámico, menos permutaciones de shader y menos memoria
r.AllowStaticLighting=False

; ---------- Sombras
; Virtual Shadow Maps: sombras nítidas del sol a cualquier distancia, pensadas para Nanite
r.Shadow.Virtual.Enable=1

; ---------- Distance fields (fallback de Lumen SW, AO y sombras lejanas)
; [R][D] Genera mesh distance fields
r.GenerateMeshDistanceFields=True
; [R][D] 0.2 por defecto; 0.25 resuelve mejor muros de 15 cm y columnas (+~25% memoria de SDF)
r.DistanceFields.DefaultVoxelDensity=0.25

; ---------- Ray tracing (requisitos de HWRT)
; [R][S] Soporte de ray tracing (necesario para Lumen HWRT)
r.RayTracing=True
; [S] Sombras RT apagadas: usamos VSM (más baratas y estables)
r.RayTracing.Shadows=False
; [R][S] Obligatorio para que los personajes skinneados entren al BVH
r.SkinCache.CompileShaders=True

; ---------- Geometría / antialiasing / texturas
; [R] Nanite para fachadas, veredas, rejas y props de alto detalle
r.Nanite.ProjectEnabled=True
; 4 = TSR (Temporal Super Resolution): renderizar al 60-75% y reconstruir
r.AntiAliasingMethod=4
; [R][S] Streaming virtual texturing (muchos sets 2K tileables) + RVT para mezclas de suelo
r.VirtualTextures=True
; Sin lightmaps, coherente con AllowStaticLighting=False
r.VirtualTexturedLightmaps=False

; ---------- Material: Substrate NO (modelo clásico de shading)
; [R][S] Fuerza el modelo clásico (desde 5.7 Substrate viene activo en proyectos nuevos)
r.Substrate=False

; ---------- Cielo y niebla
; [R][S] Habilita SkyAtmosphere
r.SupportSkyAtmosphere=True
; [R][S] La atmósfera ilumina la Exponential Height Fog (bruma del mismo color que el cielo)
r.SupportSkyAtmosphereAffectsHeightFog=True

; ---------- Exposición y features por defecto
; Autoexposición activa por defecto (el PPV la acota por preset)
r.DefaultFeature.AutoExposure=True
; 0 = histograma (más estable que Basic)
r.DefaultFeature.AutoExposure.Method=0
; [R] Min/max de exposición en EV100: imprescindible para trabajar con unidades físicas (lux)
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Compensación base 0; cada preset ajusta en su PPV
r.DefaultFeature.AutoExposure.Bias=0
; Bloom activo (intensidad baja en el PPV)
r.DefaultFeature.Bloom=True
; SSAO de respaldo cuando la escalabilidad apaga Lumen
r.DefaultFeature.AmbientOcclusion=True
; Sin luz estática, la fracción estática de AO no tiene sentido
r.DefaultFeature.AmbientOcclusionStaticFraction=False
; Motion blur activo (cantidad baja en el PPV; debe haber opción de apagarlo en el menú)
r.DefaultFeature.MotionBlur=True
; Sin lens flares
r.DefaultFeature.LensFlare=False
; Exposición local suave: calles con cielo blanco y galerías oscuras en el mismo cuadro
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.85
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.9

; ---------- Otros que activa un estudio para mundo abierto urbano
; [S] Custom depth + stencil (outlines de interacción, máscaras de post) sin recompilar más adelante
r.CustomDepth=3
; [S] Velocidades por WPO (árboles, cables al viento): TSR sin ghosting en follaje
r.Velocity.EnableVertexDeformation=1
; [R][S] Deferred (necesario para Lumen y VSM completos)
r.ForwardShading=False
; MegaLights NO por ahora: costo fijo alto para una 5050. Evaluar si de noche hay más de ~30 luces con sombra en pantalla.
; r.MegaLights.EnableForProject=True

[SystemSettings]
; cvars que no son "project settings" pero conviene fijar desde el arranque
; [R] Mantener los SDF aunque haya HWRT (fallback de la escalabilidad "Medio")
r.DistanceFields.SupportEvenIfHardwareRayTracingSupported=1
; 0 = el BVH usa las mallas fallback de Nanite (barato en VRAM). 1 = clusters Nanite (caro)
r.RayTracing.Nanite.Mode=0
; AO de corto alcance de Lumen (pies contra el piso, rejas contra el muro)
r.Lumen.ScreenProbeGather.ShortRangeAO=1
; Captura en tiempo real del SkyLight repartida en varios frames (el cielo cambia lento)
r.SkyLight.RealTimeReflectionCapture.TimeSlice=1
; MB de pool de texturas para 8 GB de VRAM (deja lugar a BVH, VSM y Nanite)
r.Streaming.PoolSize=2500

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; [R] DX12 obligatorio para Nanite + HWRT
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; [R][S] Sacar SM5 y compilar SM6 (requerido por HWRT inline, Nanite y VSM óptimos)
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
